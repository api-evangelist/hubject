openapi: 3.2.0
info:
  title: Interface Description Ccp API
  version: '1.0'
  description: 'The interfaces of the Contract Certificate Pool (CCP) are used to request the provisioning of Contract Data. It accepts Contract Data signed by a CPS. Optionally the data can be forwarded to the CCP directly by the CPS.


    This service provides the following interfaces:

    * Get Signed Contract Data

    * Provide Signed Contract Data

    * Delete Signed Contract Data

    * Get Contracts for PCID

    * Lookup Contract

    * Define Contract as Default for Offline installation

    * Add Signed Contract Data


    ### Clients


    The CCP communicates with the following actors and services:


    * The _Mobility Operator_ calls the CCP API actively to send Signed Contract Data.

    * The _Contract Provisioning Service_ forwards Signed Contract Data to the CCP.

    * The _CPO_ both send CertificateInstallationRequests to receive

    CertificateInstallationResponses

    * The _OEM_ request CertificateInstallationRequests via PCID and EMAID to receive

    CertificateInstallationResponses

    * OCSP Responders of the Contract Certificates

    * Root Certificate Pool'
  contact:
    name: Hubject GmbH
    url: https://hubject.com
    email: support@pnc.hubject.com
  termsOfService: https://www.hubject.com/pki/
  license:
    name: Attribution-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-sa/4.0/
servers: []
tags:
- name: Ccp
paths:
  /v1/ccp/signedContractData/{pcid}:
    parameters:
    - schema:
        type: string
        pattern: ^[a-zA-Z0-9]{17,18}$
        minLength: 17
        maxLength: 18
      name: pcid
      in: path
      required: true
      description: PCID of vehicle certificate
    get:
      summary: Get Contracts for PCID
      tags:
      - Ccp
      operationId: getContracts
      x-internal: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupContractResponse'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
      description: Lists available contract data for a given PCID.
      security:
      - OEM: []
      parameters:
      - schema:
          type: string
          default: urn:iso:15118:2:2013:MsgDef
          example: urn:iso:15118:2:2013:MsgDef
        in: query
        name: xsdMsgDefNamespace
        description: to receive contract data for a specific ISO version
components:
  schemas:
    LookupContractResponse:
      type: object
      title: LookupContractResponse
      x-examples:
        example-1:
          XMLContracts:
          - pcid: WMIP12345678901234
            emaid: EMP99C123456789
            xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
            contractCertificate: string
            defaultContract: true
            certValidFrom: '2019-08-24T14:15:22Z'
            certValidTo: '2019-08-24T14:15:22Z'
            cpsRootCertificateId: '"CN=V2G Root CA QA G1, DC=V2G, O=Hubject GmbH, C=DE"'
            cpsRootDistinguishedName: 896b6655-180e-4304-b642-606bb00df8f0
      properties:
        XMLContracts:
          type: array
          items:
            type: object
            properties:
              pcid:
                type: string
                description: PCID of vehicle certificate
                pattern: ^[a-zA-Z0-9]{17,18}$
                minLength: 17
                maxLength: 18
              emaid:
                type: string
                description: contract identifier of contract certificate
                pattern: ^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$
                minLength: 14
                maxLength: 15
              xsdMsgDefNamespace:
                type: string
                example: urn:iso:15118:2:2013:MsgDef
                description: ISO Version
              contractCertificate:
                type: string
                description: Contract Certificate in base64 encoded DER form
                pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                maxLength: 800
              defaultContract:
                type: boolean
                description: If set to true it will get delivered as certificateInstallationResponse. the value is defined by the OEM/User if multiple contracts are stored in the CCP for one PCID.
                example: true
                enum:
                - true
                - false
              certValidFrom:
                type: string
                format: date-time
                example: '2019-08-24T14:15:22Z'
                description: Valid From Date and Time of contract certificate
              certValidTo:
                type: string
                format: date-time
                example: '2019-08-24T14:15:22Z'
                description: Valid to Date and Time of contract certificate
              cpsRootCertificateDN:
                type: string
                example: 896b6655-180e-4304-b642-606bb00df8f0
                pattern: ^[0-9a-fA-F]{8}\-([0-9a-fA-F]{4}\-){3}[0-9a-fA-F]{12}$
                description: The DN of the desired V2G root CA
                x-stoplight:
                  id: i0q8u31ihz6re
              cpsV2GRootCertificateFingerprint:
                type: string
                description: The SHA256 Fingerprint of the desired V2G root CA which shall was used to sign these data with the regarding CPS signing certificate. Its optional. If not given, the CPS will decide which CPS signing V2G PKI will be renurned
                pattern: ^((CN|OU|O|C|DC|ST)=[^,]+,? ?)+$
                example: CN=V2G Root CA QA G1, DC=V2G, O=Hubject GmbH, C=DE
                x-stoplight:
                  id: vl0bfmhcp30fg
  securitySchemes:
    MO:
      type: oauth2
      description: 'OAuth2 is used to grant access to the endpoint. '
      flows:
        authorizationCode:
          authorizationUrl: ''
          tokenUrl: ''
          refreshUrl: ''
          scopes: {}
    OEM:
      type: oauth2
      description: 'OAuth2 is used to grant access to the endpoint. '
      flows:
        authorizationCode:
          authorizationUrl: ''
          tokenUrl: ''
          refreshUrl: ''
          scopes: {}
    CPO:
      type: oauth2
      description: 'OAuth2 is used to grant access to the endpoint. '
      flows:
        authorizationCode:
          authorizationUrl: ''
          tokenUrl: ''
          refreshUrl: ''
          scopes: {}
    CPS:
      type: oauth2
      description: 'OAuth2 is used to grant access to the endpoint. '
      flows:
        authorizationCode:
          authorizationUrl: ''
          tokenUrl: ''
          refreshUrl: ''
          scopes: {}
