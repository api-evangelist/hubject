        Result: true
        StatusCode:
          AdditionalInfo: Success
          Code: '000'
          Description: Success
        SessionID: f98efba4-02d8-4fa0-b810-9a9d50d2c527
        CPOPartnerSessionID: 1234XYZ
        EMPPartnerSessionID: 2345ABC
    eRoamingAuthorizationStop:
      type: object
      description: "Note:\n  * To `RECEIVE`\n  * Implementation: `OPTIONAL`\n\neRoamingAuthorizeStop is a message to request an authorization for stopping a charging process.\n\nNote:\n\nThis message describes the response which has to be received in return to the eRoamingAuthorizeStop request.\n"
      required:
