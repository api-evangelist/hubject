openapi: 3.2.0
info:
  title: Hubject MO API
  version: '1.0'
  contact:
    name: Hubject GmbH
    url: https://hubject.com
    email: support@pnc.hubject.com
  license:
    name: Attribution-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-sa/4.0/
  termsOfService: https://www.hubject.com/pki/
  description: 'Operations tagged MO across 3 of this provider''s published API definitions: hubject-opcp-ccp-openapi.json, hubject-opcp-cps-openapi.json, hubject-opcp-pcp-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: MO
  description: API relevant for Mobility Operators
paths:
  /v1/ccp/signedContractData/{emaid}:
    parameters:
    - schema:
        type: string
        pattern: ^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$
        minLength: 14
        maxLength: 15
      name: emaid
      in: path
      required: true
      description: Contract identifier of contract certificate
    delete:
      summary: Delete Signed Contract Data
      operationId: deleteSignedContractData
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid EMAID:
                  value:
                    errorMessages:
                    - 'emaid : must match "^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$"'
                    traceId: a079010e-4766-4f4a-9f4c-ccd0f0ddae1e
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                EMAID not found:
                  value:
                    errorMessages:
                    - The contract for the given EMAID not found.
                    traceId: bc81a20d-e517-4b5d-b6d7-e6d1888a9662
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
      tags:
      - MO
      description: 'The deletion of signed contract data from the CCP can be used to de-publish it by the MO. A revoked or expired contract certificate will be cleaned from the pool automatically. See the section Data Cleansing in the CCP description.


        The PCP calls this method when a Provisioning Certificate has been deleted. See `DELETE /oem/provCerts/{pcid}` for more details.


        ### Data validation steps


        The Contract Certificate Pool performs the following validation steps before deleting signed contract data.


        | Target | Check |

        |--------------------------|----------------------------- |

        | Authorization | Sender must be allowed to delete contract data for the given EMAID. |

        | Request Parameter | The EMAID must be provided.

        | Request Parameter | The EMAID must match the specification |

        | Request Parameter | The EMAID must reference an existing contract data package. |


        ## Automatic revocation


        > If the Contract Certificate has been issued by a Operator-operated MO CA, the certificate will be revoked automatically. This functionality can be turned of by setting the `X-Skip-Revocation` header to `true`. This is not recommended and should just be used for test cases!


        The procedure for this functionality is:


        1. CCP receives a DELETE for a EMAID.

        2. The CCP checks if the related Contract Certificated has been issued by a Operator MO V2G CA

        3. If so, the CCP sends a revocation request to the issuing CA.

        4. On successful revocation the Contract Data will be deleted from the pool. On error the Contract Data remains in the pool and an error message is returned.'
      parameters:
      - schema:
          type: boolean
          enum:
          - true
          - false
          default: false
        in: header
        name: X-Skip-Revocation
        description: Do not revoke the contract certificate.
      security:
      - MO: []
  /v1/ccp/lookupContract/{emaid}:
    parameters:
    - schema:
        type: string
        pattern: ^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$
      name: emaid
      in: path
      required: true
      description: Contract identifier of contract certificate
    get:
      summary: Lookup Contract
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupContractResponse'
              examples:
                example-1:
                  value:
                    XMLContracts:
                    - pcid: huboemprovcqa0615
                      emaid: EMP99CQATEST001
                      xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
                      contractCertificate: 
                      priority: 1
                      certValidFrom: '2022-02-07T23:17:37Z'
                      certValidTo: '2022-12-10T11:42:59Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid EMAID:
                  value:
                    errorMessages:
                    - 'emaid : must match "^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$"'
                    traceId: 02be5c05-298b-4503-a685-8126951e0233
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
      operationId: lookupContract
      description: The MO sends a request to the Contract Certificate Pool (CCP) to check the availability of the contract for the requested EMAID.
      tags:
      - MO
      security:
      - OEM: []
      - CPO: []
      parameters:
      - schema:
          type: string
          default: urn:iso:15118:2:2013:MsgDef
          example: urn:iso:15118:2:2013:MsgDef
        in: query
        name: xsdMsgDefNamespace
        description: to receive contract data for a specific ISO version
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-([0-9a-fA-F]{4}\-){3}[0-9a-fA-F]{12}$
          example: 896b6655-180e-4304-b642-606bb00df8f0
        in: query
        description: The SHA256 Fingerprint of the desired V2G root CA which shall was used to sign these data with the regarding CPS signing certificate. Its optional. If not given, the CPS will decide which CPS signing V2G PKI will be renurned
        name: cpsV2GRootCertificateFingerprint
  /v1/cps/forward/signedContractData:
    parameters: []
    put:
      summary: Create and forward Signed Contract Data
      operationId: createAndForwardSignedContractData
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid PrivateKey:
                  value:
                    errorMessages:
                    - 'contractData.contractSignatureEncryptedPrivateKey : must match "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"'
                    traceId: 3cf35ee3-13ac-4387-b37e-6a72af668727
                Invalid DH-Public-Key:
                  value:
                    errorMessages:
                    - 'contractData.dHpublickey : must match "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"'
                    traceId: e0e6eaa3-f2ce-4bfd-b067-50fd88a88bfd
                Invalid ContractCert:
                  value:
                    errorMessages:
                    - 'contractData.contractSignatureCertChain.contractSignatureCertChainCertificate : must match "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"'
                    traceId: fa6f880b-6b96-4499-8a99-036083377006
                Invalid Contract CA:
                  value:
                    errorMessages:
                    - Invalid certificate format on contractSignatureCertChainSubCertificates list
                    traceId: ef689caa-7c3b-4be0-bcb5-c667782480fd
                Invalid PCID:
                  value:
                    errorMessages:
                    - 'pcid : must match "^[a-zA-Z0-9]{17,18}$"'
                    traceId: 634cdfa3-4fe7-419d-9963-bb412929b0f3
                Invalid Emaid:
                  value:
                    errorMessages:
                    - 'emaid : must match "^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$"'
                    traceId: 57a24dd5-08e2-4d78-8a77-b49b9db411f2
                EMAID already used:
                  value:
                    errorMessages:
                    - Invalid Tupple - EMAID is already used by other PCID.
                    traceId: 3e002e2a-580b-48e4-88a5-6b782cae636b
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
      tags:
      - MO
      description: 'This interface signs Contract Data in the CPS and stores them in the CCP.


        > #### Deprecated!

        > Please be aware that this method is deprecated. Please use /v1/cps/contractData/signed'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignedContractDataRequest'
        description: Expects a [Contract Data V1](models/contract-data.v1.json) object.
      security:
      - MO_with_own_PKI: []
      deprecated: true
  /v1/cps/signedContractData:
    parameters: []
    put:
      summary: Create Signed Contract Data
      operationId: createSignedContractData
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSignedContractDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
      description: 'This interface signs Contract Data in the CPS and sends it as Signed Contract Data back to the MO. By using this method Signed Contract Data is not stored in the Contract Certificate Pool, and it is not made available for the OEM and CPO backend. After using this method, the _Add Signed Contract Data_ method of the Contract Certificate Pool could be used to store the Signed Contract Data in CCP or its getting stored in another CCP


        > #### Deprecated!

        > Please be aware that this method is deprecated. Please use /v1/cps/contractData/signed'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignedContractDataRequest'
      tags:
      - MO
      security:
      - MO_with_own_PKI: []
      deprecated: true
  /v1/cps/generate/signedContractData:
    parameters: []
    put:
      summary: Generate Signed Contract Data
      operationId: generateSignedContractData
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                EMAID already used:
                  value:
                    errorMessages:
                    - Invalid Tupple - EMAID is already used by other PCID.
                    traceId: 3e002e2a-580b-48e4-88a5-6b782cae636b
                Invalid EMAID:
                  value:
                    errorMessages:
                    - 'emaid : must match "^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$"'
                    traceId: 57a24dd5-08e2-4d78-8a77-b49b9db411f2
                Invalid PCID:
                  value:
                    errorMessages:
                    - 'pcid : must match "^[a-zA-Z0-9]{17,18}$"'
                    traceId: a29a7734-0599-4394-9300-d912a6bfd914
                Invalid Date:
                  value:
                    errorMessages:
                    - The given contractEnds date is in the past.
                    traceId: 8185b433-8598-463e-a83f-9dbfea8a33e0
                PCID not Available:
                  value:
                    errorMessages:
                    - The OEM provisioning certificate with the given PCID is not available.
                    traceId: fb683590-7de9-4c3e-ae41-a83ccb578628
            application/xml:
              schema:
                type: object
                properties: {}
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
      tags:
      - MO
      description: 'This service creates and signs contractData for delivered contract information. The contract certificate will be signed by the MO SUB CA2 which is derived from the V2G Root CA


        The created and signed contractData is stored in the contract certificate pool for provisioning to the OEM- and CPO-backend.


        To update a contractData, the interface must be called again with the same PCID and EMAID. The system will replace the old contractData with the new one.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSignedContractDataRequest'
          application/xml:
            schema:
              description: ''
              type: object
              properties:
                contractBegins:
                  type: string
                  minLength: 1
                contractEnds:
                  type: string
                  minLength: 1
                pcid:
                  type: string
                  minLength: 1
                emaid:
                  type: string
                  minLength: 1
                xsdMsgDefNamespace:
                  type: string
                  minLength: 1
              required:
              - contractBegins
              - contractEnds
              - pcid
              - emaid
              - xsdMsgDefNamespace
              x-examples:
                example-1:
                  contractBegins: '2021-05-11T00:00:00Z'
                  contractEnds: '2022-12-10T11:42:59Z'
                  pcid: huboemprovcqa0615
                  emaid: EMP99CQATest001
                  xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateSignedContractDataRequest'
        description: ''
      security:
      - MO_without_PKI: []
  /v1/oem/provCerts/{pcid}:
    parameters:
    - schema:
        type: string
        pattern: ^[a-zA-Z0-9]{17,18}$
      name: pcid
      in: path
      required: true
    get:
      summary: Get Provisioning Certificate
      tags:
      - MO
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProvisioningCertificateResponse'
              examples:
                example:
                  value:
                    OEMMessage:
                      subCA1Certificate: 
                      subCA2Certificate: 
                      vehicleCertificate: 
                      rootAuthorityKeyIdentifier: 4F:13:33:6B:AE:33:CB:1C
                      rootIssuerDistinguishedName: CN=US V2G Root CA TEST G2, DC=V2G, O=Hubject Inc., C=US
                      rootIssuerSerialNumber: 413de92d304ea90af4c9710392b437cf
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ./cps.v1.json#/components/schemas/Error
              examples:
                INVALID PCID:
                  value:
                    errorMessages:
                    - 'pcid : must match "^[a-zA-Z0-9]{17,18}$"'
                    traceId: 1c8c56cb-b71f-46a5-8788-5ddcedc88e2a
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT FOUND:
                  value:
                    errorMessages:
                    - The OEM provisioning certificate with given PCID is not found.
                    traceId: 807838e3-b058-447c-b6f8-233638cefc18
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
      operationId: getOEMProvCert
      description: 'This method is used by the MO to request Provisioning Certificates.


        Before the delivery of OEM provisioning certificate from the PCP, it proceeds with the following steps:


        1. Verifies the certificate status of each OEM certificate from the OCSP responders or CRL of an OEM.

        2. Verifies trust chain with OEM root certificate


        For each step, which cannot be validated, the PCP sends an error code to the MO.

        Returns a Provisioning Certificate V1 object if PCID/Prov Certificate was in the pool.'
      security:
      - MO: []
      - OEM: []
      parameters:
      - schema:
          type: boolean
          default: 'false'
          example: 'true'
        in: header
        description: 'if set to true - this call is not getting forwarded to other Ecosystems '
        name: broadcast
  /v1/oem/provCerts/lookupVehicle/{pcid}:
    parameters:
    - schema:
        type: string
        pattern: ^[a-zA-Z0-9]{17,18}$
        minLength: 17
        maxLength: 18
      name: pcid
      in: path
      required: true
    get:
      summary: Lookup Vehicle
      tags:
      - MO
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID PCID:
                  value:
                    errorMessages:
                    - 'pcid : must match "^[a-zA-Z0-9]{17,18}$"'
                    traceId: 1c8c56cb-b71f-46a5-8788-5ddcedc88e2a
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT FOUND:
                  value:
                    errorMessages:
                    - The OEM provisioning certificate with given PCID is not found.
                    traceId: 807838e3-b058-447c-b6f8-233638cefc18
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable
      operationId: lookupVehicle
      description: 'This method is used by the MO to test if there is a certificate available for a given PCID.


        > ### Change notice

        >

        > This method will be changed to the form `HEAD /{pcid}` in future versions to make the API more consistent.'
      security:
      - MO: []
      - OEM: []
components:
  schemas:
    LookupContractResponse:
      type: object
      title: LookupContractResponse
      x-examples:
        example-1:
          XMLContracts:
          - pcid: WMIP12345678901234
            emaid: EMP99C123456789
            xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
            contractCertificate: string
            defaultContract: true
            certValidFrom: '2019-08-24T14:15:22Z'
            certValidTo: '2019-08-24T14:15:22Z'
            cpsRootCertificateId: '"CN=V2G Root CA QA G1, DC=V2G, O=Hubject GmbH, C=DE"'
            cpsRootDistinguishedName: 896b6655-180e-4304-b642-606bb00df8f0
      properties:
        XMLContracts:
          type: array
          items:
            type: object
            properties:
              pcid:
                type: string
                description: PCID of vehicle certificate
                pattern: ^[a-zA-Z0-9]{17,18}$
                minLength: 17
                maxLength: 18
              emaid:
                type: string
                description: contract identifier of contract certificate
                pattern: ^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$
                minLength: 14
                maxLength: 15
              xsdMsgDefNamespace:
                type: string
                example: urn:iso:15118:2:2013:MsgDef
                description: ISO Version
              contractCertificate:
                type: string
                description: Contract Certificate in base64 encoded DER form
                pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                maxLength: 800
              defaultContract:
                type: boolean
                description: If set to true it will get delivered as certificateInstallationResponse. the value is defined by the OEM/User if multiple contracts are stored in the CCP for one PCID.
                example: true
                enum:
                - true
                - false
              certValidFrom:
                type: string
                format: date-time
                example: '2019-08-24T14:15:22Z'
                description: Valid From Date and Time of contract certificate
              certValidTo:
                type: string
                format: date-time
                example: '2019-08-24T14:15:22Z'
                description: Valid to Date and Time of contract certificate
              cpsRootCertificateDN:
                type: string
                example: 896b6655-180e-4304-b642-606bb00df8f0
                pattern: ^[0-9a-fA-F]{8}\-([0-9a-fA-F]{4}\-){3}[0-9a-fA-F]{12}$
                description: The DN of the desired V2G root CA
                x-stoplight:
                  id: i0q8u31ihz6re
              cpsV2GRootCertificateFingerprint:
                type: string
                description: The SHA256 Fingerprint of the desired V2G root CA which shall was used to sign these data with the regarding CPS signing certificate. Its optional. If not given, the CPS will decide which CPS signing V2G PKI will be renurned
                pattern: ^((CN|OU|O|C|DC|ST)=[^,]+,? ?)+$
                example: CN=V2G Root CA QA G1, DC=V2G, O=Hubject GmbH, C=DE
                x-stoplight:
                  id: vl0bfmhcp30fg
    Error:
      title: Error
      type: object
      properties:
        errorMessages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        traceId:
          type: string
          format: uuid
    GenerateSignedContractDataRequest:
      type: object
      title: CPS generateSignedContractDataRequest (V1)
      x-examples:
        example:
          contractBegins: '2021-05-11T00:00:00Z'
          contractEnds: '2022-12-10T11:42:59Z'
          pcid: huboemprovcqa0615
          emaid: EMP99CQATest001
          xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
      properties:
        contractBegins:
          type: string
          description: Timestamp the contract will begin at.
          x-constraint: '@ValidDateTime'
          x-constraint-message: The contractBegins does not match the specification
        contractEnds:
          type: string
          description: Timestamp until the contract is active.
          x-constraint: '@ValidDateTime'
          x-constraint-message: The contractEnds does not match the specification
        emaid:
          type: string
          pattern: ^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$
          description: contract identifier of contract certificate
        pcid:
          type: string
          pattern: ^[a-zA-Z0-9]{17,18}$
          description: PCID of vehicle certificate
        xsdMsgDefNamespace:
          type: string
          example: urn:iso:15118:2:2013:MsgDef
          x-constraint: '@ValidXsdMsgDefNamespace'
          default: urn:iso:15118:2:2013:MsgDef
          description: ISO Version which shall be used for the signature
        subscriptionUrl:
          type: string
          example: https://testmo.com/subscriptions/v2g
          pattern: ^(https?|http)://[-a-zA-Z0-9+&@#/%?=~_|!:,.;]*[-a-zA-Z0-9+&@#/%=~_|]
          description: URL which could be given by MO to allow extended information exchange for a given contract
        cpsV2GRootCertificateFingerprint:
          type: string
          description: 'The SHA256 Fingerprint of the desired V2G root CA which shall be used to sign these data with the regarding CPS signing certificate. Its optional. If not given, the CPS will decide which CPS signing V2G PKI will be used

            '
          pattern: ^[0-9a-fA-F]{8}\-([0-9a-fA-F]{4}\-){3}[0-9a-fA-F]{12}$
          example: 896b6655-180e-4304-b642-606bb00df8f0
          x-stoplight:
            id: nnb9mb40w0ojj
        metaData:
          type: string
          description: Placeholder for future adaption
      required:
      - contractBegins
      - contractEnds
      - emaid
      - pcid
      - xsdMsgDefNamespace
    CreateSignedContractDataRequest:
      type: object
      title: CPS createSignedContractDataRequest (V1)
      x-examples:
        example-1:
          contractData:
            contractSignatureCertChain:
              contractSignatureCertChainCertificate: 
              contractSignatureCertChainSubCertificates:
              - 
              - 
            contractSignatureEncryptedPrivateKey: PD5/v8Z005yianHegxvs2vE/uRPOjBaP4byhAVwyj6APg6BFOZexCpCacHTxgELr
            dHpublickey: BC//bjmXFWisWCxnJeoA2kMBZmEHfx9h/ZKlTMhbJUvm6cdc/WBuKwPlC5qVHnxguI5RouU59fc9P3y2qU0Qu0c=
            emaid: EMP99CQATEST001
          emaid: EMP99CQATEST001
          pcid: huboemprovcqa0615
          xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
      minProperties: 4
      properties:
        xsdMsgDefNamespace:
          type: string
          x-constraint: '@ValidXsdMsgDefNamespace'
          example: urn:iso:15118:2:2013:MsgDef
          default: urn:iso:15118:2:2013:MsgDef
        contractData:
