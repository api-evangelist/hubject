openapi: 3.2.0
info:
  title: Interface Description Cps API
  version: '1.0'
  description: 'The interfaces of the Certificate Provisioning Service (CPS) are used to request the provisioning of Contract Data. The Contract Certificate Pool (CCP) only accepts Contract Data signed by a trusted CPS. Optionally the data can be forwarded to the CCP directly by the CPS.


    This service provides the following interfaces:

    * Sign Contract Data by CPS

    * Generate Signed Contract Data

    * Create Signed Contract Data - deprecated

    * Create and Forward Signed Contract Data - deprecated


    ### Clients


    The CPS communicates with the following actors and services:


    * The _Mobility Operator_ calls the CPS API actively to send/create Contract Data.

    * The _Contract Certificate Pool_ receives Signed Contract Data forwarded by the CPS.

    * OCSP Responders of the Contract Certificates

    * Root Certificate Pool'
  contact:
    name: Hubject GmbH
    url: https://hubject.com
    email: support@pnc.hubject.com
  termsOfService: https://www.hubject.com/pki/
  license:
    name: Attribution-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-sa/4.0/
servers: []
tags:
- name: Cps
paths:
  /v1/cps/contractData/signed:
    parameters: []
    put:
      summary: Sign Contract Data by CPS
      operationId: put-v1-cps-signContractData
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedContractDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedContractDataRequest'
      description: 'This interface signs Contract Data in the CPS and sends it as Signed Contract Data back to the MO. By using the Parameter _PCID_ the Signed Contract Data are getting stored in the Contract Certificate Pool, and it is made available for the OEM and CPO backend.


        > #### How to store Signed Data in CCP

        > If the parameter _PCID_ is set and valid, the signed contractdata will be stored in the CCP as well. If the paramter is not set, the signed object will not be stored in the CCP.


        > #### This combines to deprecated calls

        > This function bundles to deprecated functions:

        > - /v1/cps/signedContractData

        > - /v1/cps/forward/signedContractData'
      tags:
      - Cps
  /cps/signer:
    get:
      summary: getAllCpsSigners
      tags:
      - Cps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCpsSignerResponse'
              examples:
                example-1:
                  value:
                    cpsCertificates:
                    - cpsDistinguishedName: DC=CPS,CN=CPS 2022.2 QA,O=Hubject GmbH,C=EU
                      cpsCertificate: 
                      validFrom: '2022-02-08T21:59:59Z'
                      validTo: '2022-05-08T21:59:59Z'
                      organizationName: Hubject GmbH
                      cpsRootCertificateId: e6c58da2-aeaf-438c-b484-40c3cca35e97
                      cpsRootDistinguishedName: CN=V2G Root CA QA G1, DC=V2G, O=Hubject GmbH, C=DE
                      cpsCa2Certificate: 
                      cpsCa1Certificate: 
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '500':
          description: Internal Server Error
      operationId: get-cps-signer
      description: For using getAllCpsSigners interface, no input is necessary. The Interface returns a list of all available CPS signer certificates available of the CPS operator. This method can be used by MOs to detect and define with which CPS signer the contract shall be signed
      security:
      - MO_without_PKI: []
      - MO_with_own_PKI: []
components:
  schemas:
    Error:
      title: Error
      type: object
      properties:
        errorMessages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        traceId:
          type: string
          format: uuid
    cpsSigner-data:
      description: Signing Certificate Data structure
      type: object
      x-examples:
        example-1:
          cpsDistinguishedName: DC=CPS,CN=CPS 2022.2 QA,O=Hubject GmbH,C=EU
          cpsCertificate: 
          validFrom: '2022-02-08T21:59:59Z'
          validTo: '2022-05-08T21:59:59Z'
          organizationName: Hubject GmbH
          cpsRootCertificateId: e6c58da2-aeaf-438c-b484-40c3cca35e97
          cpsRootDistinguishedName: CN=V2G Root CA QA G1, DC=V2G, O=Hubject GmbH, C=DE
          cpsCa2Certificate: 
          cpsCa1Certificate: 
      properties:
        cpsDistinguishedName:
          type: string
          minLength: 1
          example: DC=CPS,CN=CPS 2022.2 QA,O=Hubject GmbH,C=EU
          description: '

            Reflects the cps certificate distinguished name field. (informative)'
        cpsCertificate:
          type: string
          minLength: 1
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          description: Certificate Provisioning Certificate (CPS) in base64 encoded DER form
        validFrom:
          type: string
          description: '

            Reflects the subjects not before date. (infotmative)'
          format: date-time
          example: '2022-02-08T21:59:59Z'
        validTo:
          type: string
          description: Reflects the subjects not after date. (infotmative)
          example: '2022-02-08T21:59:59Z'
          format: date-time
        organizationName:
          type: string
          minLength: 1
          example: Hubject GmbH
          description: Reflects the subjects organization name value. (informative)
        cpsV2GRootCertificateFingerprint:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-([0-9a-fA-F]{4}\-){3}[0-9a-fA-F]{12}$
          example: 896b6655-180e-4304-b642-606bb00df8f0
          description: The SHA256 Fingerprint of the V2G root CA
          x-stoplight:
            id: 3jn9t2kufyxzu
        cpsRootDistinguishedName:
          type: string
          example: CN=V2G Root CA G2, DC=V2G, O=Hubject GmbH, C=DE
          pattern: ^((CN|OU|O|C|DC|ST)=[^,]+,? ?)+$
          description: Reflects the v2g root distinguished name field. (informative)
        cpsSubCa1Certificate:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          maxLength: 800
          description: Certificate Provisioning CA1 (CPS SUB CA1) in base64 encoded DER form
        cpsSubCa2Certificate:
          type: string
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          maxLength: 800
          description: Certificate Provisioning CA1 (CPS SUB CA2) in base64 encoded DER form. Is optional
        xsdMsgDefNamespace:
          type: string
          description: ISO Version
          example: urn:iso:15118:2:2013:MsgDef
      required:
      - cpsDistinguishedName
      - cpsCertificate
      - validFrom
      - validTo
      - organizationName
      - cpsV2GRootCertificateFingerprint
      - cpsRootDistinguishedName
      - cpsSubCa1Certificate
      - xsdMsgDefNamespace
    ContractData:
      description: 'Contract Data consisting of the contract certificate and its chain not including the MO Root CA itself. Furthermore the encrypted contract private key and the DH Public Key as descirbed in the ISO 15118 is included '
      type: object
      x-examples:
        example-1:
          contractCertificate: 
          contractSubCa2Certificate: 
          contractSubCa1Certificate: 
          contractSignatureEncryptedPrivateKey: PD5/v8Z005yianHegxvs2vE/uRPOjBaP4byhAVwyj6APg6BFOZexCpCacHTxgELr
          dHpublickey: BC//bjmXFWisWCxnJeoA2kMBZmEHfx9h/ZKlTMhbJUvm6cdc/WBuKwPlC5qVHnxguI5RouU59fc9P3y2qU0Qu0c=
      title: Contract Data
      properties:
        contractCertificate:
          type: string
          description: Contract Certificate in base64 encoded DER form
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          maxLength: 800
        contractSubCa2Certificate:
          type: string
          description: Contract Certificate SUB CA 2 in base64 encoded DER form
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          maxLength: 800
        contractSubCa1Certificate:
          type: string
          description: Contract Certificate SUB CA 1 in base64 encoded DER form
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          maxLength: 800
        contractSignatureEncryptedPrivateKey:
          type: string
          minLength: 1
          description: Encryted contract certificate private key
        dHpublickey:
          type: string
          minLength: 1
          description: DH Public Key as defined in the ISO15118
      required:
      - contractCertificate
      - contractSubCa1Certificate
      - contractSignatureEncryptedPrivateKey
      - dHpublickey
    SignedContractDataResponse:
      type: object
      x-examples:
        example-1:
          pcid: huboemprovcqa0615
          emaid: EMP99CQATest001
          xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
          signedData: 
      properties:
        pcid:
          type:
          - string
          - 'null'
          description: PCID of the Provisioning certificate, if null - no pcid was provided
          pattern: ^[a-zA-Z0-9]{17,18}$
        emaid:
          type: string
          pattern: ^[A-Za-z]{2}[-]?\w{3}[-]?\w{9}[-]?(\w{1})?$
          description: contract identifier of contract certificate
        xsdMsgDefNamespace:
          type: string
          minLength: 0
          pattern: urn:iso:15118:2:2013:MsgDef
          description: ISO Version
        signedData:
          type: string
          minLength: 1
          description: Format of certificationInstallationRes as defined in ISO 15118-2:2014 in XML encoded in Base64.
        cpsV2GRootCertificateFingerprint:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-([0-9a-fA-F]{4}\-){3}[0-9a-fA-F]{12}$
          example: 896b6655-180e-4304-b642-606bb00df8f0
          description: The SHA256 Fingerprint of the desired V2G root CA which shall be used to sign these data with the regarding CPS signing certificate. Its optional. If not given, the CPS will decide which CPS signing V2G PKI will be used
          x-stoplight:
            id: wuzfrkqu3xqlx
        cpsRootDistinguishedName:
          type: string
          pattern: ^((CN|OU|O|C|DC|ST)=[^,]+,? ?)+$
          example: CN=V2G Root CA G2, DC=V2G, O=Hubject GmbH, C=DE
          description: Reflects the v2g root distinguished name field. (informative)
        metaData:
          type: string
          description: Placeholder for future adaption
      required:
      - emaid
      - xsdMsgDefNamespace
      - signedData
      - cpsV2GRootCertificateFingerprint
      - cpsRootDistinguishedName
    SignedContractDataRequest:
      type: object
      x-examples:
        example-1:
          contractData:
            contractSignatureCertChain:
              contractSignatureCertChainCertificate: 
              contractSignatureCertChainSubCertificates:
              - 
              - 
            contractSignatureEncryptedPrivateKey: PD5/v8Z005yianHegxvs2vE/uRPOjBaP4byhAVwyj6APg6BFOZexCpCacHTxgELr
            dHpublickey: BC//bjmXFWisWCxnJeoA2kMBZmEHfx9h/ZKlTMhbJUvm6cdc/WBuKwPlC5qVHnxguI5RouU59fc9P3y2qU0Qu0c=
            emaid: EMP99CQATEST001
          emaid: EMP99CQATEST001
          pcid: huboemprovcqa0615
          xsdMsgDefNamespace: urn:iso:15118:2:2013:MsgDef
      title: Signed Contract Data Request
      properties:
        contractData:
          $ref: '#/components/schemas/ContractData'
        pcid:
          type: string
          description: PCID of the Provisioning certificate
          pattern: ^[a-zA-Z0-9]{17,18}$
        xsdMsgDefNamespace:
          type: string
          description: ISO Version
          example: urn:iso:15118:2:2013:MsgDef
        cpsV2GRootCertificateFingerprint:
          type: string
          description: The SHA256 Fingerprint of the desired V2G root CA which shall be used to sign these data with the regarding CPS signing certificate. Its optional. If not given, the CPS will decide which CPS signing V2G PKI will be used
          pattern: ^[0-9a-fA-F]{8}\-([0-9a-fA-F]{4}\-){3}[0-9a-fA-F]{12}$
          example: 896b6655-180e-4304-b642-606bb00df8f0
          x-stoplight:
            id: lniusdls2gm2u
      required:
      - contractData
      - xsdMsgDefNamespace
    GetAllCpsSignerResponse:
      title: GetAllCpsSignerResponse
      type: object
      x-examples:
        example-1:
          cpsCertificates:
          - cpsDistinguishedName: DC=CPS,CN=CPS 2022.2 QA,O=Hubject GmbH,C=EU
            cpsCertificate: 
            validFrom: '2022-02-08T21:59:59Z'
            validTo: '2022-05-08T21:59:59Z'
            organizationName: Hubject GmbH
            cpsRootCertificateId: e6c58da2-aeaf-438c-b484-40c3cca35e97
            cpsRootDistinguishedName: CN=V2G Root CA QA G1, DC=V2G, O=Hubject GmbH, C=DE
            cpsCa2Certificate: 
            cpsCa1Certificate: 
      properties:
        cpsCertificates:
          type: array
          items:
            $ref: '#/components/schemas/cpsSigner-data'
  securitySchemes:
    MO_without_PKI:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: ''
          tokenUrl: ''
          refreshUrl: ''
          scopes: {}
      description: OAuth2 is used to grant access to the endpoint. In the case of "MO without PKI" role, the MO is using Hubject V2G PKI to sign certificates.
    MO_with_own_PKI:
      type: oauth2
      description: 'OAuth2 is used to grant access to the endpoint. '
      flows:
        authorizationCode:
          authorizationUrl: ''
          tokenUrl: ''
          refreshUrl: ''
          scopes: {}
