- aid: hubject:hubject-eroamingevsedata-api
  name: Hubject E Roaming Evse Data API
  description: >-
    Hubject offers the possibility to upload and download charging spot (EVSE) data and, thus, to exchange
    data between different partners.


    See apendix for a detailed business process diagram regarding the EVSE data service.


    The eRoamingEvseData service offers two operations:


    eRoamingPushEvseData in order to give CPOs the possibility to upload (push) EVSE master data


    eRoamingPullEvseData in order to give EMPs the possibility to download (pull) EVSE data from partner
    operators via Hubject.


    Hub CPOs may also push EVSE data of sub operators. Hubject does not distinguish between EVSE records
    of hub operators and related sub operators.
