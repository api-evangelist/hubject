  name: Hubject E Roaming Evse Status API
  description: >-
    Hubject offers the possibility to upload and download dynamic charging spot (EVSE) status information
    and thus to exchange the data between different partners.


    The eRoamingEvseStatus service offers two operations:


    1. eRoamingPushEvseStatus in order to give CPOs the possibility to upload (push) EvseStatus data


    2. eRoamingPullEvseStatus in order to give EMPs the possibility to download (pull) EVSE status data
    from partner operators via Hubject


    Hub CPOs may also push EVSE status records of sub operators. Hubject does not distinguish between
    EvseStatus records of hub operators and related sub operators.
