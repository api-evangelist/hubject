- aid: hubject:hubject-eroamingdynamicpricing-api
  name: Hubject E Roaming Dynamic Pricing API
  description: >-
    Since OICP 2.2, HBS offers the possibility to flexibly or dynamically price Authorization services.
    The service mainly enables pushing (upload) and pulling (download) of pricing data to and from the
    HBS through webservice requests and/or downloads/uploads in the Hubject portal.


    Flexible pricing enables CPOs to offer differentiated pricing (in multiple currencies) of charging
    processes at their charging stations. The differentiation of prices can be done along relevant dimensions
    such as charging facility characteristics (e.g. maximum charging power), EVSE location and time. OICP
    2.2 and OICP 2.3 offers the possibility to exchange this flexible price differentiation over webservice
    communication between CPOs and EMPs.


    In addition to the above flexible pricing capability, OICP 2.2 and OICP 2.3 enables more frequent
    and near real-time update and exchange of pricing information between CPOs and EMPs. This is achieved
    whereby a CPO continuously pushes valid prices to the HBS for specific EMPs to pull these prices.


    With OICP 2.2 and OICP 2.3 , the HBS offers an extensive breadth of technical capabilities for flexible
    and dynamic pricing of charging services for CPOs. Please refer to the supplementary document [“Dynamic
    Pricing - Functional Guide for Service Implementation”](https://support.hubject.com/hc/en-us/articles/360002042838-Introduction-to-Flexible-Dynamic-Pricing)
    for more details and a holistic view (technical and business perspectives) of how to best capitalize
    on the capabilities offered by the eRoamingDynamicPricing service.


    The eRoamingDynamicPricing service offers four operations, namely the:

    1. eRoamingPushPricingProductData operation which gives CPOs the possibility to upload (push) pricing
    product information. Pricing products refer to the different tariffs offered by a CPO based on the
    differentiation dimensions mentioned above.

    2. eRoamingPushEVSEPricing operation which gives CPOs the possibility to assign their various pricing
    products to individual EVSEs and thereby upload (push) location/EVSE-specific pricing data.

    3. eRoamingPullPricingProductData operation which gives EMPs the possibility to download (pull) pricing
    product information uploaded by a CPO for the respective EMP.

    4. eRoamingPullEVSEPricing operation which gives EMPs the possibility to download (pull) location/EVSE-specific
    pricing data uploaded by CPOs for the respective EMP.
  humanURL: https://www.hubject.com/products/intercharge-cpo
  baseURL: https://service.hubject.com/api/oicp
  tags:
  - eRoamingDynamicPricing
