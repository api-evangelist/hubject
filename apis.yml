description: 'Hubject is the Berlin-based eMobility interoperability hub behind the intercharge network, connecting charge point operators (CPOs)
  and e-mobility service providers (EMPs) for cross-network EV charging (eRoaming) and operating a leading ISO 15118 Plug&Charge public key infrastructure.
  It publishes its interfaces openly on GitHub: the Open InterCharge Protocol (OICP 2.3) for CPOs and EMPs (authorization, charge detail records,
  EVSE data and status, dynamic pricing, reservation and charging notifications against service.hubject.com/api/oicp), the Open Plug&Charge Protocol
  (OPCP 1.0) for contract and certificate provisioning, and Next Generation Pricing (NGP) automation APIs, plus a hosted Open Plug&Charge testing
  environment.'

