- aid: hubject:hubject-eroamingauthenticationdata-api
  name: Hubject E Roaming Authentication Data API
  description: >-
    This service is only offered by Hubject.


    In addition to the online authorization service that requests customer authentication data on demand
    from the connected partner systems, Hubject offers the possibility to upload authentication data.


    If an EMP uploads their data to Hubject, Hubject can authorize requests from other partners (e.g.
    CPOs) without having to forward the request to the EMP. The eRoamingPushAuthenticationData operation
    gives EMPs the possibility to upload (push) authentication data to the HBS.


    Furthermore, Hub EMPs may also push authentication data of sub-EMPs. Hubject does not distinguish
    between authentication records of hub providers and their related sub providers.
